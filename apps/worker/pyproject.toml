[project]
name = "atp-worker"
version = "0.1.0"
description = "ATP background worker — live strategy loop, data ingestion, scheduled jobs"
requires-python = ">=3.12"
dependencies = [
  "atp-core",
  "arq>=0.26",
  "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_worker"]
