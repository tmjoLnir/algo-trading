name: atp

services:
  db:
    # TimescaleDB: OHLCV bars are the one table that grows without bound.
    # Hypertables + native compression keep years of minute bars queryable.
    image: timescale/timescaledb:2.15.2-pg16
    environment:
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp
      POSTGRES_DB: atp
    # Loopback, never 0.0.0.0. Published at all only because `make migrate`,
    # `seed` and `backfill` run from the host against localhost:5432 — nothing
    # inside the stack needs it, the api and worker reach `db` over the compose
    # network. The credentials here are atp/atp, so binding this to every
    # interface hands the trading database to whoever is on the network
    # (docs/SAFETY.md, "Access control").
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp -d atp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Comes back with the machine, like everything else in this file now. See
    # the note on `api` below for what the absence of this line used to cost.
    restart: unless-stopped

  redis:
    # Latest-quote cache, pub/sub fan-out of market data to the API's WebSocket,
    # and the job queue for scheduled backtests/reports.
    image: redis:7-alpine
    command: redis-server --appendonly yes
    # Loopback, for the same reason as db above, and one of its own: this holds
    # the kill-switch state, with no password in front of it. Anything that can
    # reach this port can clear a halt — the one control docs/RUNBOOK.md tells
    # an operator to reach for first.
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # As db. Redis holds the kill-switch state, and the risk chain fails closed
    # against an unreachable one — so a Redis that does not come back is a
    # platform that comes back halted.
    restart: unless-stopped

  migrate:
    # `alembic upgrade head`, from inside the network, against `db`. One shot:
    # it runs, it exits, and nothing depends on it staying up.
    #
    # **Why this exists.** The worker reads its `worker_config` row at boot and
    # refuses to start without it (ADR 0023, and `atp_worker.main` says why).
    # That row lives in a table only a migration creates, and until now the only
    # thing that ran a migration was `make migrate` — from the *host*, needing
    # uv and a Python toolchain. So a clean `git clone && make up` produced a
    # worker in a permanent crash-loop, which is the thing Phase 0's "make up
    # works end to end" claims does not happen.
    #
    # **Why it is behind a profile and not a `depends_on`.** Making api, worker
    # and queue depend on this would migrate the database automatically wherever
    # the stack comes up — including `make deploy`. On a deployed host applying
    # a migration is a decision an operator makes inside a halt window, between
    # stopping new risk and clearing the halt (docs/DEPLOYMENT.md, "Every deploy
    # after that"). A container that quietly reshapes the schema of a database
    # holding open positions, at whatever moment compose happens to start it, is
    # not a convenience. So the profile keeps it out of every `up`, and `make
    # up` / `make up-prod` invoke it as an explicit step; `make deploy` does not,
    # and the runbook's `make migrate` stays exactly where it is.
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # `db`, not localhost: this runs on the compose network, unlike the
      # host-side `make migrate` that alembic/env.py's fallback is written for.
      DATABASE_URL: postgresql+asyncpg://atp:atp@db:5432/atp
    depends_on:
      db: {condition: service_healthy}
    command: ["alembic", "-c", "infra/alembic/alembic.ini", "upgrade", "head"]
    # A migration that fails must stay failed and be seen. Restarting it would
    # retry a broken revision until the log scrolled past the reason.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    # Optional on purpose. `.env` is gitignored, so it does not exist in a fresh
    # clone — and a required env_file that is missing makes every compose
    # command fail at parse time, `down` and `ps` included. `make up` writes one
    # from .env.example; without it the services fall back to their defaults,
    # which are the safe ones (see atp_core.config.Settings).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://atp:atp@db:5432/atp
      REDIS_URL: redis://redis:6379/0
    # Loopback, and deliberately nothing else. The API authenticates now
    # (ADR 0008), which changes what this port is worth to a stranger and not
    # whether it should be published: docs/SAFETY.md keeps everything but the
    # dashboard on localhost. Published only for the developer's own /docs and
    # curl.
    #
    # The dashboard does NOT need this port. nginx proxies /api and /ws to
    # `api` across the compose network (infra/docker/web.nginx.conf), so
    # putting the dashboard on a LAN does not put the API there with it. That
    # is the property that makes exposing one port a defensible thing to do.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./libs:/app/libs
      - ./apps/api:/app/apps/api
    # Two commands, and the first one is load-bearing.
    #
    # `--reload` is a SUPERVISOR, not a server. uvicorn's reloader forks a child
    # that binds the port and serves; the parent only watches the source. When
    # the child cannot start at all — `Settings` refusing to validate on a typo
    # in `.env`, an import error anywhere under `create_app()` — the child dies
    # and **the parent does not**. It sits there waiting for a file change that
    # a container has nobody to make.
    #
    # That is the failure this whole service is arranged to survive, arriving in
    # the one shape the arrangement cannot see. The container stays `Up`. Nothing
    # is listening on 8000. `restart: unless-stopped` below never fires, because
    # there is no exit to restart — a restart policy acts on a process that
    # died, and this one is alive and idle. The HEALTHCHECK in the image does
    # notice, and Docker does nothing with an unhealthy container but label it.
    #
    # From a browser it is indistinguishable from the 502 this file already
    # documents, and it is permanent in a way that one no longer is:
    #
    #     connect() failed (111: Connection refused) while connecting to
    #     upstream, request: "GET /api/v1/auth/me", upstream: "http://172.18.0.4:8000"
    #
    # — nginx resolved the API, reached its container and found the port shut,
    # so the dashboard renders in full and the sign-in screen it renders is
    # `Cannot reach the API.`, for as long as anyone cares to wait. It also
    # defeats the diagnosis docs/RUNBOOK.md gives for that screen, which is to
    # look for a climbing restart count: there isn't one. `docker compose ps`
    # says `Up`.
    #
    # So the app is imported ONCE, in the foreground, before the reloader is
    # given PID 1. A configuration this process cannot start with is then an
    # exit code — visible, restarted, and with the traceback in `logs api` —
    # rather than a silence. It costs one extra import at startup, and only
    # startup: once this passes, `--reload` behaves exactly as it did, and an
    # edit that breaks the app mid-session still leaves the reloader waiting for
    # the edit that fixes it, which is the whole point of running it here.
    command: >
      sh -c "python -c 'import atp_api.main' &&
             exec uvicorn atp_api.main:app --host 0.0.0.0 --port 8000 --reload"
    # THE line that keeps the dashboard working, and it was missing.
    #
    # `web-prod` restarts forever and this did not, which made the two ends of
    # the same request disagree about whether the stack was running. nginx came
    # back from every exit — a host reboot, an OOM kill, a `docker restart`, a
    # laptop suspended with the stack up — and went on serving the dashboard
    # perfectly, against an API that had exited once and stayed exited. What
    # that looks like in a browser is the whole page rendering and then
    # `Failed to load dashboard: Error: 502: Bad Gateway`, permanently, because
    # a 502 is nginx saying it could not reach this container and nothing was
    # ever going to start it again. The dashboard looked alive, which is what
    # made it slow to diagnose: the thing that was down was the half nobody was
    # looking at.
    #
    # `unless-stopped` rather than `always`: a `docker compose stop api` to work
    # on something must stay stopped. The distinction matters more here than it
    # usually does — this file is also what `make up-prod` runs, and that is the
    # dashboard on 8080 (docs/DASHBOARD.md, "Serving it").
    #
    # This does NOT make a crash-loop invisible, which is the objection the
    # `worker` note below raises against exactly this line: the API starts
    # cleanly on a fresh checkout with no credentials, so a container that keeps
    # exiting here is a real fault rather than an unimplemented entry point, and
    # `docker compose ps` shows the restart count either way.
    restart: unless-stopped

  worker:
    # Market-data ingestion + the live strategy loop. Deliberately a separate
    # process from the API: a strategy must not be able to stall HTTP requests,
    # and the two scale on different axes.
    #
    # In the default stack as of the worker entry point landing. It was behind a
    # `worker` profile while `atp_worker.main` raised NotImplementedError, which
    # `restart: unless-stopped` would have turned into an endless crash-loop —
    # and a red container everyone learns to ignore. It now starts: with the
    # defaults in .env.example (backtest mode, no credentials, no watchlist) it
    # reports that it has no watchlist and runs the schedule, which is an idle
    # process rather than a failing one.
    #
    # Whether it trades is not decided here. The watchlist, the strategy and
    # the rest of what it trades live in the database and are edited on the
    # dashboard's Worker tab; with nothing saved this ingests no market data,
    # places no orders, and runs the schedule. Changes there take effect at the
    # worker's next start — `docker compose restart worker`.
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://atp:atp@db:5432/atp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    # `expose`, never `ports`. The worker serves its own /metrics (ADR 0013) and
    # it is reachable across this network and from nowhere else — the same trust
    # boundary db and redis sit behind. Publishing it would put the watchlist
    # and the order flow on the host's interfaces, which is what
    # `make check-bindings` refuses.
    expose:
      - "9101"
    volumes:
      - ./libs:/app/libs
      - ./apps/worker:/app/apps/worker
    restart: unless-stopped

  queue:
    # The arq worker: backtests the API queued. A THIRD process, and the split
    # from `worker` above is the same reasoning that split `worker` from `api`,
    # one level down.
    #
    # A backtest is minutes of solid synchronous Python. Run inside `worker` it
    # would hold that process's event loop for the whole run — no ticks
    # consumed, no bars stored, and `StalenessMonitor` eventually halting
    # trading because the feed looked dead. It is not dead; the process is busy
    # being a calculator. Nothing that a person asks for on demand may be able
    # to stop the thing that manages open positions.
    #
    # Same image as `worker` — same code, same dependencies, different entry
    # point. Building a second image for one command would mean two images to
    # keep in step.
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://atp:atp@db:5432/atp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./libs:/app/libs
      - ./apps/worker:/app/apps/worker
    # No ports and no `expose`. This process serves nothing: it reads a queue and
    # writes rows. It places no orders either — the engine's broker is simulated
    # and lives inside the run — so nothing here reaches a venue.
    command: python -m atp_worker.queue
    # As the others. A restart is also how an interrupted run gets cleaned up:
    # `queue.on_startup` sweeps rows left at `running` by the process that died,
    # so a worker coming back is what turns a run stuck forever into a run that
    # says it was interrupted.
    restart: unless-stopped

  web:
    # The Vite dev server, with HMR and the source bind-mounted. This is what
    # `make up` runs and it stays that way: a production image has to be
    # rebuilt for every edit, which is the wrong trade for the loop you spend
    # the day in. The built bundle is `web-prod` below.
    build:
      # Context is the repo root, as it already is for api and worker — the
      # nginx config the prod stage needs lives under infra/docker/, which a
      # context rooted at apps/web cannot reach.
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    environment:
      # Deliberately NOT VITE_API_BASE_URL. The dashboard now addresses the API
      # on its own origin, and the dev server proxies /api and /ws across
      # (vite.config.ts) exactly as nginx does in production — so the two
      # environments resolve the API the same way instead of only both working.
      # Inside this container `localhost` is this container, hence the service
      # name.
      ATP_DEV_PROXY_TARGET: http://api:8000
    # Loopback. The dev server serves the same unauthenticated dashboard as the
    # built one, so it gets the same default. To reach a dashboard from another
    # machine, use `make up-prod` and ATP_WEB_BIND_ADDR below — one deliberate
    # way out of localhost is easier to reason about than two.
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    # As every other service in this file, and it was the last one without it.
    #
    # The asymmetry that produced the permanent 502 — one end of a request
    # restarting forever while the other stayed down — was fixed on `api` and
    # left standing here, pointing the other way. After a host reboot or an OOM
    # kill this stack came back with the API, the worker, the queue and both
    # stores running and the thing serving the dashboard stopped, so `make up`
    # was needed to finish a boot that looked complete from every other angle.
    #
    # A dev server is worth restarting for the same reason nginx is: it is the
    # half of the pair a person points a browser at.
    restart: unless-stopped

  web-prod:
    # The dashboard as deployed: `npm run build` output served by nginx, with
    # /api and /ws proxied to the API so the browser only ever sees one origin.
    #
    # Behind a profile so that `make up` — and CI's `stack` job, which is a
    # roadmap deliverable — are completely unaffected by it. `make up-prod`
    # starts this one instead of `web`.
    #
    # SIGNING IN IS REQUIRED, AND THIS STILL BELONGS ON A PRIVATE NETWORK
    # (docs/SAFETY.md). The API authenticates — one operator against a bcrypt
    # hash, a signed HttpOnly cookie, read/full scopes, and a rate limit on the
    # login endpoint (ADRs 0008, 0009, 0010). The risk endpoints are built and
    # they do ask who is calling: /risk/halt takes any session because
    # hesitation is the expensive part, while /resume and the flatten-all that
    # liquidates at market additionally demand the account password again.
    #
    # This comment used to say the opposite — no authentication, those handlers
    # stubs — and it was read by whoever was deciding how to expose this port,
    # which made it the worst line in the file to leave stale.
    #
    # What is still missing is everything around the password: this is plain
    # HTTP, so on a LAN the book and the password itself cross the wire in
    # clear text; a session cannot be revoked before it expires; and there is
    # one account, so a stolen cookie is the operator. Bind 8080 to a private
    # network — that is a floor holding, not a perimeter.
    profiles: ["prod"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: prod
    environment:
      API_UPSTREAM: http://api:8000
    # THE one port meant to be reachable from another machine, and the only
    # binding in this file that is configurable:
    #
    #   unset          -> 127.0.0.1, this host only (the default)
    #   192.168.1.50   -> that LAN interface
    #   100.x.y.z      -> a Tailscale interface
    #   10.8.0.1       -> a WireGuard interface
    #
    # Fail-closed on purpose. An operator who forgets to set it gets a dashboard
    # nobody else can reach, which is the harmless half of the mistake; the
    # other half is a trading book on every interface of the machine. Do not set
    # it to 0.0.0.0 — pick the one address you mean.
    #
    # `:-` and not `-`, and the difference is the whole guarantee. `make up`
    # copies .env.example to .env, so ATP_WEB_BIND_ADDR arrives *set and empty*
    # rather than absent. `:-` substitutes the default for an empty value; `-`
    # substitutes only for a missing one, and would resolve this to ":8080:80"
    # — host_ip dropped, which is 0.0.0.0. One character between fail-closed and
    # fail-open, in the direction nobody would notice.
    ports: ["${ATP_WEB_BIND_ADDR:-127.0.0.1}:8080:80"]
    depends_on:
      # Waiting for healthy rather than started: nginx resolves its upstream
      # per request here (see the resolver in web.nginx.conf), so it would boot
      # happily against a missing API and serve a dashboard that 502s on its
      # first poll. This makes the first page load a working one.
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
