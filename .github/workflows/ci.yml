name: CI

on:
  push:
    # This repository's default branch is `claude/main`; `main` is listed too so
    # the trigger survives a rename. Watching only `main` meant merges to the
    # actual default branch ran no CI at all — code was verified on the PR and
    # then never again on the branch it landed in.
    branches: [main, claude/main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: CI must never be able to reach a live broker.
  ATP_RUN_MODE: backtest
  ATP_ALLOW_LIVE_TRADING: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.2-pg16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp
          POSTGRES_DB: atp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # --frozen: the lockfile is authoritative. If pyproject.toml changed
      # without `uv lock` being re-run, fail here rather than silently
      # resolving something different from what anyone tested against.
      - id: sync
        run: uv sync --all-packages --frozen

      # ── the four gates ──────────────────────────────────────────────────
      #
      # Each one runs even when an earlier one failed, and each one still
      # fails the job on its own. That combination is the point.
      #
      # By default a failing step aborts the rest, so `mypy` going red took
      # both test steps down as "skipped" and the job reported one generic
      # failure. #18 merged that way: it looked like a lone type error, and
      # in fact nothing had been tested at all. A red gate must never be able
      # to disguise the gates behind it as passing — or, worse, as absent.
      #
      # `!cancelled()` rather than `always()`: this workflow sets
      # cancel-in-progress, and `always()` would keep grinding through the
      # suite of a run that has already been superseded.
      #
      # Both conditions matter. Dropping the `steps.sync` clause would run
      # every gate against an environment that failed to install, turning one
      # honest lockfile error into four misleading ones.
      #
      # Note this is deliberately NOT `continue-on-error`. That would let the
      # job go green with a type error in it, which is weakening the gate
      # rather than reporting it (CLAUDE.md §7).

      - name: Lint
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run mypy libs apps

      - name: Unit tests
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run pytest tests/unit --cov --cov-report=xml

      - name: Integration tests
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        env:
          DATABASE_URL: postgresql+asyncpg://atp:atp@localhost:5432/atp_test
          REDIS_URL: redis://localhost:6379/0
        # The exit-5 tolerance that used to live here is gone: integration tests
        # exist now, so an empty collection means they stopped being collected,
        # which is a failure and not something to wave through. These are the
        # only tests that run the migrations against a real TimescaleDB — the
        # hypertable, its chunk interval and its compression policy cannot be
        # asserted anywhere else.
        run: |
          uv run pytest tests/integration -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - id: install
        run: npm ci

      # Same four-gates arrangement as the `python` job above, for the same
      # reason — a failing `npm run lint` used to hide whether the tests and
      # the build were even viable. Named, because a skipped step reads very
      # differently from a step that never got the chance to run.
      - name: Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run lint

      - name: Format check
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run format:check

      - name: Type check
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test -- --run

      - name: Build
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run build

  # `make up` is a roadmap deliverable in its own right, and it is the one thing
  # in this repository that no unit or integration test can speak for: it builds
  # three images and starts four containers. It breaks in ways the Python suite
  # cannot see — a Dockerfile that no longer copies a package, a compose file
  # referencing a gitignored env_file, an entry point that exits on boot — and
  # it breaks silently, because nobody runs it until the day they need it.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Static, and first, because it is about what the committed file *says*
      # rather than what starts. The platform has no authentication, so a
      # service published on 0.0.0.0 puts the trading database, the Redis
      # holding the kill-switch state, or the API itself on every interface of
      # the host. That should fail a build, not wait to be found by whoever
      # scans the subnet first. docs/SAFETY.md, "Access control".
      - name: No service binds every interface
        run: make check-bindings

      # No `.env` is created first, deliberately: this must work on a clone with
      # nothing but the tracked files, which is exactly what a new contributor
      # has. `make up` is responsible for producing one from .env.example.
      - name: make up
        run: make up

      - name: Wait for the API to report healthy
        # Polls the published port rather than the container HEALTHCHECK, whose
        # 30s interval would dominate the wall clock here.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"ok"'; then
              echo "api healthy after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "api never became healthy"; exit 1

      - name: The app is actually mounted, not just the process alive
        # /healthz answers from a bare router; /docs only renders once every
        # router in create_app() has imported and mounted cleanly.
        run: curl -fsS -o /dev/null -w 'docs %{http_code}\n' http://localhost:8000/docs

      - name: Wait for the web dev server
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:5173; then
              echo "web responding after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web dev server never responded"; exit 1

      - name: Every default service is up, and none is restarting
        # Catches the failure mode this job was written for: a container that
        # boots, dies and is restarted forever still looks "started" to compose.
        run: |
          docker compose ps
          not_running=$(docker compose ps --format '{{.Service}} {{.State}}' \
            | awk '$2 != "running" { print $1 " is " $2 }')
          if [ -n "$not_running" ]; then
            echo "::error::expected every service to be running -- $not_running"
            exit 1
          fi

      # ── the built dashboard ────────────────────────────────────────────
      # `make up` runs the dev server, deliberately and permanently — it is the
      # right thing for the loop developers spend the day in. Which leaves the
      # production image built by nobody until the person deploying builds it,
      # and that is the worst possible moment to find out it does not. These
      # steps are the only place it is ever built.
      - name: Build and start the built dashboard
        run: docker compose --profile prod up -d --build web-prod

      - name: Wait for nginx to serve the bundle
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "web-prod responding after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web-prod never responded"; exit 1

      - name: The bundle carries no hardcoded API host
        # The regression this exists for, and it is a silent one: Vite inlines
        # VITE_API_BASE_URL at BUILD time, so setting it as runtime container
        # environment (which compose used to do) does nothing whatsoever to a
        # built bundle and the default gets compiled in instead. A bundle with a
        # hostname in it works only on the machine it was built for, and fails
        # by talking to nothing rather than by failing to build.
        run: |
          asset=$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::no hashed JS asset referenced by index.html"; exit 1
          fi
          echo "checking $asset"
          # Downloaded first rather than piped straight into grep: in a pipeline
          # the exit status is grep's, so a curl that failed for any reason
          # would read as "found nothing" and pass. `-e` aborts here instead.
          curl -fsS "http://localhost:8080$asset" -o bundle.js
          if grep -qE '(https?|wss?)://(localhost|127\.0\.0\.1):[0-9]+' bundle.js; then
            echo "::error::a host is compiled into the bundle -- it must address the API on its own origin"
            grep -oE '(https?|wss?)://(localhost|127\.0\.0\.1):[0-9]+' bundle.js | sort -u
            exit 1
          fi
          echo "no hardcoded host in the bundle"
          rm -f bundle.js

      - name: The API answers on the dashboard's own origin
        # Same-origin is the entire design. If this 404s or 502s, the deployed
        # dashboard renders perfectly and then talks to nothing.
        run: |
          curl -fsS http://localhost:8080/healthz | grep -q '"ok"' \
            || { echo "::error::/healthz does not reach the API through nginx"; exit 1; }
          echo "healthz via the proxy: ok"

      - name: A client-side route survives a hard refresh
        # /positions has no file behind it; without the SPA fallback a reload on
        # any route but / is a 404, which is the classic way a working SPA looks
        # broken to everyone who did not arrive via the home page.
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/positions)
          [ "$code" = "200" ] || { echo "::error::SPA fallback broken (/positions -> $code)"; exit 1; }
          echo "SPA fallback: /positions -> 200"

      - name: Container logs
        if: failure()
        run: docker compose --profile prod logs --tail=120

      - name: make down
        if: always()
        run: make down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A leaked broker key is the one CI failure that cannot be fixed by a
      # follow-up commit — it has to be revoked at the broker.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
