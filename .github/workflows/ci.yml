name: CI

on:
  push:
    # This repository's default branch is `claude/main`; `main` is listed too so
    # the trigger survives a rename. Watching only `main` meant merges to the
    # actual default branch ran no CI at all — code was verified on the PR and
    # then never again on the branch it landed in.
    branches: [main, claude/main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: CI must never be able to reach a live broker.
  ATP_RUN_MODE: backtest
  ATP_ALLOW_LIVE_TRADING: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.2-pg16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp
          POSTGRES_DB: atp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # --frozen: the lockfile is authoritative. If pyproject.toml changed
      # without `uv lock` being re-run, fail here rather than silently
      # resolving something different from what anyone tested against.
      - id: sync
        run: uv sync --all-packages --frozen

      # ── the four gates ──────────────────────────────────────────────────
      #
      # Each one runs even when an earlier one failed, and each one still
      # fails the job on its own. That combination is the point.
      #
      # By default a failing step aborts the rest, so `mypy` going red took
      # both test steps down as "skipped" and the job reported one generic
      # failure. #18 merged that way: it looked like a lone type error, and
      # in fact nothing had been tested at all. A red gate must never be able
      # to disguise the gates behind it as passing — or, worse, as absent.
      #
      # `!cancelled()` rather than `always()`: this workflow sets
      # cancel-in-progress, and `always()` would keep grinding through the
      # suite of a run that has already been superseded.
      #
      # Both conditions matter. Dropping the `steps.sync` clause would run
      # every gate against an environment that failed to install, turning one
      # honest lockfile error into four misleading ones.
      #
      # Note this is deliberately NOT `continue-on-error`. That would let the
      # job go green with a type error in it, which is weakening the gate
      # rather than reporting it (CLAUDE.md §7).

      - name: Lint
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run mypy libs apps tests

      - name: Unit tests
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run pytest tests/unit --cov --cov-report=xml

      # A fifth gate, and the only one here that reaches the network.
      #
      # `wip #12` in docs/ROADMAP.md is the one claim in that file about
      # something outside it, and nothing could check it: every assertion in
      # test_roadmap_summary.py is a statement about the document. On 2026-09-02
      # all twenty-one `wip` markers named PRs that had already merged, one of
      # them (#40) a PR that never merged at all — and the summary test passed
      # on every one of those days (#125).
      #
      # `GITHUB_TOKEN` is the repo-scoped token Actions issues per run: it is
      # read-only here and lifts the API's 60/hour anonymous limit. Without it
      # this would rate-limit itself into uselessness on a busy day.
      #
      # It cannot fail on a network problem. The script answers "unknown" for
      # anything that is not a definite reading and only goes red when it can
      # name a merged or closed PR — because a check that goes red when GitHub
      # is unreachable is a check people learn to re-run, which is how the
      # `stack` job's sampled restart check came to certify a worker that could
      # not boot (ADR 0024).
      - name: Roadmap `wip` markers name PRs that are still open
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/check_roadmap_wip.py

      - name: Integration tests
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        env:
          DATABASE_URL: postgresql+asyncpg://atp:atp@localhost:5432/atp_test
          REDIS_URL: redis://localhost:6379/0
        # The exit-5 tolerance that used to live here is gone: integration tests
        # exist now, so an empty collection means they stopped being collected,
        # which is a failure and not something to wave through. These are the
        # only tests that run the migrations against a real TimescaleDB — the
        # hypertable, its chunk interval and its compression policy cannot be
        # asserted anywhere else.
        run: |
          uv run pytest tests/integration -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - id: install
        run: npm ci

      # Same four-gates arrangement as the `python` job above, for the same
      # reason — a failing `npm run lint` used to hide whether the tests and
      # the build were even viable. Named, because a skipped step reads very
      # differently from a step that never got the chance to run.
      - name: Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run lint

      - name: Format check
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run format:check

      - name: Type check
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run test -- --run

      - name: Build
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: npm run build

  # `make up` is a roadmap deliverable in its own right, and it is the one thing
  # in this repository that no unit or integration test can speak for: it builds
  # three images and starts four containers. It breaks in ways the Python suite
  # cannot see — a Dockerfile that no longer copies a package, a compose file
  # referencing a gitignored env_file, an entry point that exits on boot — and
  # it breaks silently, because nobody runs it until the day they need it.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Static, and first, because it is about what the committed file *says*
      # rather than what starts. A service published on 0.0.0.0 puts the
      # trading database, the Redis holding the kill-switch state, or the API
      # on every interface of the host — and of those three only the API asks
      # for a password (ADR 0008). Postgres answers to atp/atp and Redis to
      # nobody. That should fail a build, not wait to be found by whoever scans
      # the subnet first. docs/SAFETY.md, "Access control".
      - name: No service binds every interface
        run: make check-bindings

      # No `.env` is created first, deliberately: this must work on a clone with
      # nothing but the tracked files, which is exactly what a new contributor
      # has. `make up` is responsible for producing one from .env.example.
      - name: make up
        run: make up

      - name: Wait for the API to report healthy
        # Polls the published port rather than the container HEALTHCHECK, whose
        # 30s interval would dominate the wall clock here.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"ok"'; then
              echo "api healthy after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "api never became healthy"; exit 1

      - name: The app is actually mounted, not just the process alive
        # /healthz answers from a bare router; /docs only renders once every
        # router in create_app() has imported and mounted cleanly.
        run: curl -fsS -o /dev/null -w 'docs %{http_code}\n' http://localhost:8000/docs

      - name: Wait for the web dev server
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:5173; then
              echo "web responding after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web dev server never responded"; exit 1

      - name: Every default service is up, and none is restarting
        # Catches the failure mode this job was written for: a container that
        # boots, dies and is restarted forever still looks "started" to compose.
        #
        # Sampling `.State` once could not do it, and the gap is not theoretical.
        # A crash-looping container is `running` for most of every cycle — it
        # boots, works for a moment, dies, waits out the backoff — so one reading
        # catches it or misses it by luck. #124 merged a worker that could not
        # boot at all because this step read `running` on the sample it happened
        # to take; the identical tree then failed twice on the next PR. Two green,
        # two red, same code. A check that is right half the time is worse than
        # no check, because it teaches everyone that the red one was the flake.
        #
        # So ask Docker for its own restart counter instead, twice, with a
        # settling window in between. A looping container increments it; a
        # healthy one does not, whatever `.State` happens to say at either
        # instant. The window is longer than it looks it needs to be on purpose:
        # Docker backs off exponentially between restarts, so by the time this
        # step runs a container that has been failing since boot may be a good
        # few seconds into its next wait.
        run: |
          docker compose ps
          restart_counts() {
            for c in $(docker compose ps -aq); do
              docker inspect -f '{{.Name}} {{.RestartCount}}' "$c"
            done | sort
          }
          before=$(restart_counts)
          sleep 30
          after=$(restart_counts)
          if [ "$before" != "$after" ]; then
            echo "::error::a container restarted during a 30s window -- it is crash-looping, not running"
            diff <(echo "$before") <(echo "$after") || true
            docker compose ps
            docker compose logs --tail=60
            exit 1
          fi
          echo "no container restarted in 30s"
          not_running=$(docker compose ps --format '{{.Service}} {{.State}}' \
            | awk '$2 != "running" { print $1 " is " $2 }')
          if [ -n "$not_running" ]; then
            echo "::error::expected every service to be running -- $not_running"
            docker compose logs --tail=60
            exit 1
          fi

      # `running` is not `serving`, and the gap between them is this job's
      # blind spot. `.State` is `running` for a container whose HEALTHCHECK has
      # been failing for an hour: Docker labels an unhealthy container and does
      # nothing else to it, and the step above reads only the label it does not
      # set. The failure that shape describes — the API container up, nothing
      # bound to 8000, every proxied request refused — would pass everything
      # before this line.
      - name: Every service with a healthcheck is actually healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "" && $2 != "healthy" { print $1 " is " $2 }')
            [ -z "$unhealthy" ] && { echo "every healthcheck reports healthy"; exit 0; }
            sleep 2
          done
          docker compose ps
          echo "::error::a container is running but not healthy -- $unhealthy"
          docker compose logs --tail=60 api
          exit 1

      # The hop the browser actually makes, which nothing above exercises: the
      # steps before this reach the API on its own published port and the dev
      # server at `/`, so a dashboard whose every API call fails would pass all
      # of them. Both bugs this job has missed in this area were on this hop —
      # the run-mode banner reading `/` and getting index.html, and the API not
      # starting at all.
      #
      # 401 is the expected answer and a healthy one: nobody is signed in, and
      # it is what puts the sign-in form on screen. A 000 (refused), a 500 (the
      # dev proxy could not reach the API) or an HTML body all mean the
      # dashboard would be showing "Cannot reach the API".
      - name: The API answers on the dev server's own origin
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' http://localhost:5173/api/v1/auth/me)
          type=$(curl -s -o /dev/null -w '%{content_type}' http://localhost:5173/api/v1/auth/me)
          echo "/api/v1/auth/me -> $code ($type)"; cat body.txt; echo
          [ "$code" = "401" ] || { echo "::error::the login gate does not reach the API through the dev server"; exit 1; }
          case "$type" in application/json*) ;; *) echo "::error::not JSON -- something in front answered instead of the API"; exit 1;; esac
          rm -f body.txt

      # The regression that produced "Cannot reach the API" for an operator:
      # `Settings` refused to validate without ALPACA_API_KEY outside backtest
      # mode, and since `atp_api.main` builds `app` at import, the API could not
      # start — it crash-looped behind `restart: unless-stopped` with /healthz
      # and /readyz down alongside it.
      #
      # Everything above runs in `backtest`, because that is what .env.example
      # ships and it is the one mode exempt from that check, so CI could not see
      # it. `.env.example` tells the operator to move to `paper` next, which is
      # exactly when it bites. No credentials are set here on purpose: not being
      # able to trade is correct, and not being able to *boot* is the bug.
      - name: The API still serves in a run mode it has no credentials for
        run: |
          sed -i 's/^ATP_RUN_MODE=.*/ATP_RUN_MODE=paper/' .env
          docker compose up -d --force-recreate api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"ok"'; then
              echo "api healthy in paper mode after ~${i}s"
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/auth/me)
              [ "$code" = "401" ] || { echo "::error::login gate answers $code in paper mode"; exit 1; }
              echo "login gate: 401"
              sed -i 's/^ATP_RUN_MODE=.*/ATP_RUN_MODE=backtest/' .env
              docker compose up -d --force-recreate api
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API does not start in paper mode without broker credentials"
          docker compose logs --tail=40 api
          exit 1

      # The regression this branch exists for, asserted as behaviour rather
      # than as YAML.
      #
      # `uvicorn --reload` is a supervisor: the child binds the port, the parent
      # watches the source. A child that cannot start — any `Settings` value
      # that will not validate, which is one typo in `.env` — dies and leaves
      # the parent running, waiting for a file change nobody in a container is
      # going to make. The container stays `running`, nothing is bound to 8000,
      # and `restart: unless-stopped` never fires because nothing exited. nginx
      # then answers `connect() failed (111: Connection refused)` on every
      # request forever, behind a dashboard that renders perfectly and a
      # `docker compose ps` that says `Up`.
      #
      # A malformed number rather than a run mode on purpose: it reproduces the
      # class exactly — a ValidationError raised while `atp_api.main` builds its
      # app at import — and cannot be misread as switching this job towards
      # live trading (CLAUDE.md 1.8).
      - name: A configuration the API cannot start with is an exit, not a silence
        run: |
          sed -i 's/^RISK_MAX_POSITION_PCT=.*/RISK_MAX_POSITION_PCT=not-a-number/' .env
          docker compose up -d --force-recreate api || true
          cid=$(docker compose ps -aq api | head -n1)

          # Poll the restart count. Do NOT sample `.State` once after a fixed
          # sleep, which is what this step did and is why it was racy.
          #
          # The corrected API *crash-loops* under a config it cannot parse: the
          # foreground `python -c 'import atp_api.main'` raises, PID 1 exits,
          # `restart: unless-stopped` starts it again, and it exits again. So
          # `docker compose ps` reads `restarting` for most of that cycle and
          # `running` for the fraction of a second the import takes before it
          # fails. `[ "$state" != "running" ]` therefore asserted a property the
          # *correct* behaviour does not have; it passed only because a single
          # sample usually missed the window. Run 32956727804 landed inside it
          # and reported `Up Less than a second (health: starting)` — on a tree
          # byte-identical to one whose CI had already passed.
          #
          # The climbing restart count is the real signal, and the one
          # docs/RUNBOOK.md tells an operator to look for. The regression this
          # step exists to catch — a `--reload` parent idling over a dead child
          # — never exits, so its count stays 0 for as long as anyone waits.
          # That distinction is exact rather than probabilistic.
          restarts=0
          for _ in $(seq 1 40); do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$cid" 2>/dev/null || echo 0)
            if [ "${restarts:-0}" -gt 0 ]; then break; fi
            sleep 1
          done

          docker compose ps api
          state=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo gone)
          # `|| true` on the assignment, NOT `|| echo 000` inside it. curl
          # writes its own `000` for a refused connection AND exits non-zero,
          # so an `echo` in the pipeline appends a second one: the variable
          # holds `000000`, never equals `000`, and the comparison below can
          # never be true. That is how this step read when it was written, and
          # it passed for the same reason a `[ -z ]` on a two-line string does.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/healthz) || true
          echo "api state=$state  restarts=$restarts  /healthz=$code"

          # First that the setup took effect at all. If the API still answers,
          # the malformed value never reached `Settings` — the sed missed, or
          # the recreate did not happen — and everything below would pass while
          # demonstrating nothing. A test that cannot fail is worse than absent:
          # it reports the property as held.
          [ "$code" = "000" ] || {
            echo "::error::the API still answers ($code) -- the broken value never took effect, so this step proves nothing"
            exit 1
          }

          # Then the regression itself: never exited, and serving nothing.
          [ "${restarts:-0}" -gt 0 ] || {
            echo "::error::the api container has never exited (restarts=$restarts, state=$state) and answers nothing -- a dead app behind a live reloader, which restart: unless-stopped cannot see"
            docker compose logs --tail=40 api
            exit 1
          }
          echo "a config the API cannot start with exits and is restarted rather than idling as a live API (restarts=$restarts, state=$state)"

      - name: And it recovers by itself once the configuration is fixed
        run: |
          sed -i 's/^RISK_MAX_POSITION_PCT=.*/RISK_MAX_POSITION_PCT=0.10/' .env
          docker compose up -d --force-recreate api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"ok"'; then
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/auth/me)
              [ "$code" = "401" ] || { echo "::error::login gate answers $code after recovery"; exit 1; }
              echo "api healthy again after ~${i}s, login gate: 401"; exit 0
            fi
            sleep 1
          done
          echo "::error::the api did not come back after restoring .env"
          docker compose logs --tail=40 api
          exit 1

      # ── the built dashboard ────────────────────────────────────────────
      # `make up` runs the dev server, deliberately and permanently — it is the
      # right thing for the loop developers spend the day in. Which leaves the
      # production image built by nobody until the person deploying builds it,
      # and that is the worst possible moment to find out it does not. These
      # steps are the only place it is ever built.
      - name: Build and start the built dashboard
        run: docker compose --profile prod up -d --build web-prod

      - name: Wait for nginx to serve the bundle
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "web-prod responding after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web-prod never responded"; exit 1

      # The step above proves nginx answers on the published port. This proves
      # the container's own HEALTHCHECK agrees, which is a different question —
      # and for the whole life of this file the two disagreed. The probe asked
      # `localhost`, which resolves to ::1 before 127.0.0.1, and nginx binds
      # IPv4 only, so web-prod served every request and reported `unhealthy`
      # forever (fixed in infra/docker/web.Dockerfile, which has the detail).
      #
      # Nothing here caught it, and the reason is worth keeping: the
      # `Every service with a healthcheck is actually healthy` step is ~200
      # lines above, and runs before this service is started. Even now it would
      # not see it — `docker compose ps` without `--profile prod` does not list
      # web-prod at all. A check that cannot observe a service is not coverage
      # of it.
      - name: The built dashboard's own healthcheck agrees it is serving
        run: |
          for i in $(seq 1 45); do
            health=$(docker compose --profile prod ps --format '{{.Service}} {{.Health}}' \
              | awk '$1 == "web-prod" { print $2 }')
            [ "$health" = "healthy" ] && {
              echo "web-prod healthcheck: healthy after ~$((i * 2))s"; exit 0; }
            sleep 2
          done
          docker compose --profile prod ps
          docker inspect "$(docker compose --profile prod ps -q web-prod)" \
            --format '{{range .State.Health.Log}}exit={{.ExitCode}} out={{.Output}}
            {{end}}' | tail -3
          echo "::error::web-prod serves the bundle but its own healthcheck reports '$health'"
          exit 1

      - name: The bundle carries no hardcoded API host
        # The regression this exists for, and it is a silent one: Vite inlines
        # VITE_API_BASE_URL at BUILD time, so setting it as runtime container
        # environment (which compose used to do) does nothing whatsoever to a
        # built bundle and the default gets compiled in instead. A bundle with a
        # hostname in it works only on the machine it was built for, and fails
        # by talking to nothing rather than by failing to build.
        run: |
          asset=$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::no hashed JS asset referenced by index.html"; exit 1
          fi
          echo "checking $asset"
          # Downloaded first rather than piped straight into grep: in a pipeline
          # the exit status is grep's, so a curl that failed for any reason
          # would read as "found nothing" and pass. `-e` aborts here instead.
          curl -fsS "http://localhost:8080$asset" -o bundle.js
          if grep -qE '(https?|wss?)://(localhost|127\.0\.0\.1):[0-9]+' bundle.js; then
            echo "::error::a host is compiled into the bundle -- it must address the API on its own origin"
            grep -oE '(https?|wss?)://(localhost|127\.0\.0\.1):[0-9]+' bundle.js | sort -u
            exit 1
          fi
          echo "no hardcoded host in the bundle"
          rm -f bundle.js

      - name: The API answers on the dashboard's own origin
        # Same-origin is the entire design. If this 404s or 502s, the deployed
        # dashboard renders perfectly and then talks to nothing.
        run: |
          curl -fsS http://localhost:8080/healthz | grep -q '"ok"' \
            || { echo "::error::/healthz does not reach the API through nginx"; exit 1; }
          echo "healthz via the proxy: ok"

      - name: The API answers under /api through nginx
        # `/healthz` above proves the proxy works, but it is its own `location =`
        # block. `location /api/` is what every request the dashboard makes goes
        # through, and it was covered by nothing.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)
          [ "$code" = "401" ] || { echo "::error::/api/ does not reach the API through nginx (got $code)"; exit 1; }
          echo "/api/v1/auth/me via nginx: 401"

      - name: A client-side route survives a hard refresh
        # /positions has no file behind it; without the SPA fallback a reload on
        # any route but / is a 404, which is the classic way a working SPA looks
        # broken to everyone who did not arrive via the home page.
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/positions)
          [ "$code" = "200" ] || { echo "::error::SPA fallback broken (/positions -> $code)"; exit 1; }
          echo "SPA fallback: /positions -> 200"

      - name: Container logs
        if: failure()
        run: docker compose --profile prod logs --tail=120

      - name: make down
        if: always()
        run: make down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A leaked broker key is the one CI failure that cannot be fixed by a
      # follow-up commit — it has to be revoked at the broker.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
