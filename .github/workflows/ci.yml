name: CI

on:
  push:
    # This repository's default branch is `claude/main`; `main` is listed too so
    # the trigger survives a rename. Watching only `main` meant merges to the
    # actual default branch ran no CI at all — code was verified on the PR and
    # then never again on the branch it landed in.
    branches: [main, claude/main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: CI must never be able to reach a live broker.
  ATP_RUN_MODE: backtest
  ATP_ALLOW_LIVE_TRADING: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.2-pg16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp
          POSTGRES_DB: atp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # --frozen: the lockfile is authoritative. If pyproject.toml changed
      # without `uv lock` being re-run, fail here rather than silently
      # resolving something different from what anyone tested against.
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy libs apps

      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=xml

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://atp:atp@localhost:5432/atp_test
          REDIS_URL: redis://localhost:6379/0
        # There are no integration tests yet (Phase 1). pytest exits 5 on an
        # empty collection, which would fail the job for the wrong reason.
        # Tolerate ONLY exit 5 — every real failure still fails the build, and
        # this starts asserting the moment the first integration test lands.
        run: |
          uv run pytest tests/integration -m integration || [ $? -eq 5 ]

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A leaked broker key is the one CI failure that cannot be fixed by a
      # follow-up commit — it has to be revoked at the broker.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
