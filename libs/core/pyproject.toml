[project]
name = "atp-core"
version = "0.1.0"
description = "ATP trading core — domain, strategy, risk, backtest, analytics"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "websockets>=12.0",
  "pandas-market-calendars>=4.4",   # NYSE sessions, half-days, holidays
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_core"]
