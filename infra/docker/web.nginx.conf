# The dashboard, served as static files, with the API on the SAME ORIGIN.
#
# Why same-origin rather than the SPA on one host and the API on another: Vite
# inlines the API base URL into the bundle at build time, so a bundle built for
# one hostname is wrong at every other one — an image per environment, and a
# silent fall back to localhost the first time the variable is missed. Proxying
# /api and /ws from whatever origin served index.html means the bundle carries
# no hostname at all, so one image is correct everywhere, and CORS stops being
# part of the deployment because the browser only ever sees one origin.
#
# This is a template: the nginx image runs envsubst over /etc/nginx/templates
# at start, which is what fills in ${API_UPSTREAM}. NGINX_ENVSUBST_FILTER in
# the Dockerfile restricts that pass to exactly that name, so nginx's own
# $host, $request_uri and friends below are left alone.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. nginx resolves an upstream named in `proxy_pass`
    # once, at startup, and caches the address forever — so a plain
    # `proxy_pass http://api:8000` keeps proxying to a dead IP after the api
    # container restarts and gets a new one, until nginx itself is restarted.
    # Going through a variable defers the lookup to request time, and `valid=`
    # bounds how long a stale answer can survive.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "${API_UPSTREAM}";

    # The bundle is ~614 kB raw and ~179 kB gzipped. That difference is a
    # visible wait on first load even over a LAN.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # ── the API, on this origin ──────────────────────────────────────────────
    # $request_uri rather than a rewritten path: the API really is mounted at
    # /api/v1, so the prefix is passed through untouched rather than stripped.
    # It also carries the query string, which /dashboard/equity-curve?days= needs.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probes are unversioned in the API on purpose (main.py), so they
    # keep their own names here rather than moving under /api. Hitting /healthz
    # through this proxy answers "is the whole chain up", which is the question
    # worth asking from outside — nginx being down answers itself, with a
    # refused connection rather than a 200 that speaks for a dead API.
    location = /healthz {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # ── the WebSocket ────────────────────────────────────────────────────────
    location /ws {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # The dashboard's socket is idle between events by design — it carries
        # ticks and fills, and a quiet market produces neither. nginx's default
        # 60s read timeout would cut it on every quiet minute and leave the
        # client in a permanent reconnect loop, which reads on screen exactly
        # like a broken feed.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── static assets ────────────────────────────────────────────────────────
    # Vite fingerprints every asset (index-CUeR-PAT.js), so an asset URL's
    # content never changes and can be cached indefinitely. index.html must not
    # be: it is the only file naming the current hashes, and a cached copy
    # points a returning browser at asset URLs that no longer exist after a
    # deploy — a blank dashboard that a reload does not fix.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # /positions and /orders are client-side routes with no file behind them; a
    # hard refresh on one must return index.html rather than 404. Written last
    # for reading order only — nginx matches the longest prefix, not the first,
    # so this cannot swallow /api/ or /ws wherever it sits in the file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
