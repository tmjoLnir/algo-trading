[project]
name = "atp"
version = "0.1.0"
description = "ATP — web-based algorithmic trading platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["libs/core", "apps/api", "apps/worker"]

[tool.uv.sources]
atp-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",        # property tests for portfolio/P&L invariants
  "freezegun>=1.5",
  "respx>=0.21",              # httpx mocking for broker adapters
  "ruff>=0.5",
  "mypy>=1.10",
  "types-python-dateutil",
  "pre-commit>=3.7",
]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/core/src", "apps/api/src", "apps/worker/src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # import sorting
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtin shadowing
  "C4",               # comprehensions
  "DTZ",              # flake8-datetimez — enforces tz-aware datetimes (rule §1.2)
  "SIM",              # simplify
  "TCH",              # type-checking imports
  "PTH",              # pathlib
  "RUF",
]
ignore = [
  "E501",     # line length is handled by the formatter
  # Prose in this repo deliberately uses typographic characters (— → ≤ ×) in
  # docstrings and comments. They are not confusable ASCII lookalikes here.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]   # prints are fine in operator scripts
# FastAPI resolves route-handler annotations at RUNTIME to build request
# validators and the OpenAPI schema. Moving those imports into `if
# TYPE_CHECKING` type-checks fine and then fails when a request arrives or
# /openapi.json is generated — the base-class exemption below does not help,
# because handlers are plain functions, not Pydantic models.
"apps/api/**" = ["TC"]

[tool.ruff.lint.isort]
# Declare the workspace packages EXPLICITLY. Left to inference, ruff classifies
# them by probing the `src` paths on disk, which resolved differently on a CI
# runner than locally — identical commit, identical ruff version, one green and
# one red on I001. Import grouping should not depend on the filesystem it runs
# on, so name them.
known-first-party = ["atp_core", "atp_api", "atp_worker"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy resolve annotations at RUNTIME to build validators and
# column types. Moving these imports into `if TYPE_CHECKING` would satisfy the
# linter and break every model in the repo at import time — so exempt any class
# deriving from them.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
  "sqlalchemy.orm.DeclarativeBase",
]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
# src-layout monorepo: tell mypy where the roots are instead of letting it infer
# them. Without this it resolved `atp_core` from the installed editable package
# on CI but from source locally — 61 files checked there, 66 here, and an
# import-untyped error that only ever appeared on CI.
mypy_path = "libs/core/src:apps/api/src:apps/worker/src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The core is the part that must not lie about its types.
module = "atp_core.*"
strict = true

[[tool.mypy.overrides]]
# Add third-party modules here only once something actually imports them —
# `warn_unused_configs` reports overrides that match nothing, and a config full
# of pre-emptive entries trains everyone to ignore mypy's output.
# `pandas.*` belongs here when the backtest engine lands (Phase 2).
module = ["structlog.*", "pandas_market_calendars.*"]
ignore_missing_imports = true

# ────────────────────────── pytest ──────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: needs Postgres/Redis",
  "e2e: full stack",
  "slow: excluded from the default fast loop",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["libs/core/src", "apps/api/src", "apps/worker/src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
