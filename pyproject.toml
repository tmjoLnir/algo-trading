[project]
name = "atp"
version = "0.1.0"
description = "ATP — web-based algorithmic trading platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["libs/core", "apps/api", "apps/worker"]

[tool.uv.sources]
atp-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",        # property tests for portfolio/P&L invariants
  "freezegun>=1.5",
  "respx>=0.21",              # httpx mocking for broker adapters
  "ruff>=0.5",
  "mypy>=1.10",
  "types-python-dateutil",
  "pre-commit>=3.7",
]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/core/src", "apps/api/src", "apps/worker/src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # import sorting
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtin shadowing
  "C4",               # comprehensions
  "DTZ",              # flake8-datetimez — enforces tz-aware datetimes (rule §1.2)
  "SIM",              # simplify
  "TCH",              # type-checking imports
  "PTH",              # pathlib
  "RUF",
]
ignore = ["E501"]     # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]   # prints are fine in operator scripts

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The core is the part that must not lie about its types.
module = "atp_core.*"
strict = true

[[tool.mypy.overrides]]
module = ["alpaca.*", "pandas.*", "structlog.*"]
ignore_missing_imports = true

# ────────────────────────── pytest ──────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: needs Postgres/Redis",
  "e2e: full stack",
  "slow: excluded from the default fast loop",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["libs/core/src", "apps/api/src", "apps/worker/src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
